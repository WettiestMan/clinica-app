<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludCitas - Revisa Tu Solicitud</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/saludcitas.css}">
</head>
<body class="sc-layout">

    <!-- Menú y estilos compartidos con agendar-cita.html -->
    <aside th:replace="~{fragments/sidebar :: sidebar('mis-citas')}"></aside>

    <div class="sc-workspace">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <main class="sc-content">
            <div class="sc-container">
        <h2 class="text-3xl font-bold text-black mb-6">Revisa Tu Solicitud</h2>
        <div class="bg-white rounded-[32px] p-8 shadow-sm max-w-4xl flex-1 flex flex-col justify-between">
            <div class="space-y-6">

                <div>
                    <h3 class="text-xl font-semibold text-black">No se pudo completar la solicitud</h3>
                    <p class="text-zinc-500 text-sm mt-1">Revisa los datos ingresados para continuar.</p>
                </div>
                <div role="alert" class="p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-sm" th:text="${mensaje}"></div>
                <div class="flex items-center flex-wrap gap-4 pt-4">
                    <a th:if="${session.usuarioLogueado != null}" th:href="@{/citas/cancelar}" class="px-8 py-3 bg-[#2D735C] text-white font-medium text-base rounded-xl hover:bg-[#235b49] transition shadow-sm inline-flex items-center justify-center">Volver a intentarlo</a>
                    <a th:if="${session.usuarioLogueado == null}" th:href="@{/login}" class="px-6 py-3 bg-[#F3F4F6] text-zinc-700 font-medium text-sm rounded-xl hover:bg-zinc-200 transition inline-flex items-center justify-center">Iniciar sesión</a>
                </div>

            </div>
        </div>
    
            </div>
</main>
    </div>
</body>
</html>
