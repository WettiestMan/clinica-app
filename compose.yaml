services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clinica_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD antes de iniciar PostgreSQL}
    ports:
      - "5432:5432"
    volumes:
      - saludcitas_pgdata:/var/lib/postgresql/data
volumes:
  saludcitas_pgdata:
