<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludCitas - Restablecer Contraseña</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen w-full relative flex items-center justify-center p-4 bg-zinc-100 overflow-hidden">

    <!-- Fondo de consultorio médico con desenfoque suave -->
    <div class="absolute inset-0 bg-cover bg-center filter blur-sm scale-105 opacity-60 pointer-events-none"
         style="background-image: url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1920&q=80');">
    </div>
    <!-- Overlay blanco -->
    <div class="absolute inset-0 bg-white/40 pointer-events-none"></div>

    <!-- TARJETA CENTRAL FLOTANTE -->
    <div class="relative w-full max-w-[540px] bg-white/95 backdrop-blur-md rounded-[40px] p-10 md:p-14 shadow-2xl border border-zinc-200/80 z-10 flex flex-col items-center">
        
        <!-- Logo Corazón SVG -->
        <div class="w-16 h-16 mb-4 flex items-center justify-center">
            <svg viewBox="0 0 24 24" fill="none" class="w-full h-full text-[#F4A79D] stroke-current" stroke-width="1.8">
                <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" 
                      fill="#FFF1F0" stroke="#F4A79D"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 12h2l1-2.5 2 5 1-2.5h2" stroke="#F4A79D"/>
            </svg>
        </div>

        <!-- Título -->
        <h2 class="text-2xl md:text-3xl font-medium text-zinc-800 text-center mb-8">
            Restablecer Contraseña
        </h2>

        <!-- Formulario -->
        <form th:action="@{/recuperar-password/cambiar}" method="post" id="formRestablecer" class="w-full space-y-4">
            
            <!-- Campo oculto para el token o correo asociado -->
             <!-- Campo oculto con el correo del paciente -->
            <input type="hidden" name="correo" th:value="${correo}">

            <!-- Campo 1: Nueva Contraseña -->
            <div class="flex flex-col gap-1.5">
                <label for="nuevaPassword" class="text-zinc-600 text-xs md:text-sm font-medium">Nueva Contraseña</label>
                <div class="relative w-full">
                    <input type="password" id="nuevaPassword" name="nuevaPassword" required
                           pattern="(?=.*[A-Z])(?=.*\d).{8,}"
                           title="Mínimo 8 caracteres, al menos una letra mayúscula y un número"
                           placeholder="Ingrese su nueva contraseña"
                           class="w-full px-5 py-3.5 pr-11 rounded-2xl bg-[#EEF2F4] text-zinc-800 text-sm placeholder:text-zinc-400 outline-none focus:ring-1 focus:ring-zinc-400 transition">
                    <button type="button" onclick="togglePasswordVisibility('nuevaPassword', 'eye-new-closed', 'eye-new-open')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black focus:outline-none" tabindex="-1">
                        <svg id="eye-new-closed" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                        <svg id="eye-new-open" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Campo 2: Confirmar Contraseña -->
            <div class="flex flex-col gap-1.5">
                <label for="confirmPassword" class="text-zinc-600 text-xs md:text-sm font-medium">Confirmar Contraseña</label>
                <div class="relative w-full">
                    <input type="password" id="confirmPassword" name="confirmPassword" required
                           placeholder="Confirme su nueva contraseña"
                           class="w-full px-5 py-3.5 pr-11 rounded-2xl bg-[#EEF2F4] text-zinc-800 text-sm placeholder:text-zinc-400 outline-none focus:ring-1 focus:ring-zinc-400 transition">
                    <button type="button" onclick="togglePasswordVisibility('confirmPassword', 'eye-conf-closed', 'eye-conf-open')"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black focus:outline-none" tabindex="-1">
                        <svg id="eye-conf-closed" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                        </svg>
                        <svg id="eye-conf-open" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Mensaje de error si no coinciden -->
            <p id="passwordMismatchError" class="text-red-500 text-xs font-medium hidden">
                ⚠️ Las contraseñas no coinciden.
            </p>

            <!-- Requisito de contraseña -->
            <p class="text-[11px] md:text-xs text-zinc-500 font-light pt-0.5">
                Mínimo 8 caracteres, una mayúscula y un número
            </p>

            <!-- Botón Guardar nueva contraseña -->
            <div class="pt-4">
                <button type="submit" 
                        class="w-full py-3.5 px-6 bg-[#6FAFA7] hover:bg-[#5E9E96] text-white font-medium text-sm md:text-base rounded-2xl border border-[#528F87] transition shadow-sm text-center">
                    Guardar nueva contraseña
                </button>
            </div>

        </form>

    </div>

    <!-- Script de validación e íconos de ojo -->
    <script>
        function togglePasswordVisibility(inputId, closedIconId, openIconId) {
            const input = document.getElementById(inputId);
            const closedIcon = document.getElementById(closedIconId);
            const openIcon = document.getElementById(openIconId);

            if (input.type === 'password') {
                input.type = 'text';
                closedIcon.classList.add('hidden');
                openIcon.classList.remove('hidden');
            } else {
                input.type = 'password';
                closedIcon.classList.remove('hidden');
                openIcon.classList.add('hidden');
            }
        }

        // Validación de coincidencia de contraseñas
        const form = document.getElementById('formRestablecer');
        const pass = document.getElementById('nuevaPassword');
        const confPass = document.getElementById('confirmPassword');
        const errorMsg = document.getElementById('passwordMismatchError');

        form.addEventListener('submit', function(e) {
            if (pass.value !== confPass.value) {
                e.preventDefault();
                errorMsg.classList.remove('hidden');
                confPass.focus();
            } else {
                errorMsg.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
