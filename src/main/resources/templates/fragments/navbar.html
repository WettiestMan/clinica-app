<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<header th:fragment="navbar" class="sc-navbar"
        th:with="rolMenu=${rolVista != null ? rolVista : (session.rol != null ? session.rol : (session.medicoLogueado != null ? 'MEDICO' : 'PACIENTE'))},
                 nombreMenu=${nombreVista != null ? nombreVista : (session.usuarioLogueado != null ? session.usuarioLogueado.nombres : (session.medicoLogueado != null ? session.medicoLogueado.nombres : (rolMenu == 'JEFE_MEDICO' ? 'Jefe Médico' : (rolMenu == 'MEDICO' ? 'Médico' : 'Paciente'))))},
                 apellidoMenu=${session.usuarioLogueado != null ? session.usuarioLogueado.apellidos : (session.medicoLogueado != null ? session.medicoLogueado.apellidos : '')},
                 correoMenu=${correoVista != null ? correoVista : (session.usuarioLogueado != null ? session.usuarioLogueado.correo : '')}">
    <button type="button" class="sc-mobile-nav" data-open-sidebar aria-controls="sidebarPrincipal" aria-expanded="false" aria-label="Abrir menú principal"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
    <button type="button" class="sc-nav-overlay" data-close-sidebar aria-label="Cerrar menú principal" tabindex="-1"></button>
    <div class="sc-user-menu" id="userMenuContainer">
        <button id="userMenuBtn" type="button" class="sc-user-button" aria-expanded="false" aria-controls="userDropdown">
            <span class="sc-avatar" th:text="${#strings.isEmpty(nombreMenu) ? 'U' : #strings.toUpperCase(#strings.substring(nombreMenu, 0, 1))}">U</span>
            <span class="sc-user-button-name" th:text="${nombreMenu}">Paciente</span>
            <svg class="sc-icon sc-icon-small" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
        </button>
        <div id="userDropdown" class="sc-user-dropdown" hidden>
            <div class="sc-user-details">
                <span class="sc-kicker">Conectado como</span>
                <strong th:text="${nombreMenu + ' ' + apellidoMenu}">Paciente</strong>
                <small th:if="${!#strings.isEmpty(correoMenu)}" th:text="${correoMenu}"></small>
                <small th:text="${rolMenu == 'JEFE_MEDICO' ? 'Jefe Médico' : (rolMenu == 'MEDICO' ? 'Médico' : 'Paciente')}">Paciente</small>
            </div>
            <a th:if="${rolMenu == 'PACIENTE'}" th:href="@{/perfil}" class="sc-user-action"><svg class="sc-icon sc-icon-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a7 7 0 00-14 0v2M17 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg><span>Mi Perfil</span></a>
            <button type="button" class="sc-logout-trigger abrir-modal-logout"><svg class="sc-icon sc-icon-small" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14 5-5-5-5m5 5H9"></path></svg><span>Cerrar Sesión</span></button>
        </div>
    </div>
    <div id="modalLogout" class="sc-modal" role="dialog" aria-modal="true" aria-labelledby="tituloLogout" aria-describedby="detalleLogout" hidden>
        <div class="sc-modal-panel">
            <div class="sc-modal-icon"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14 5-5-5-5m5 5H9"></path></svg></div>
            <h3 id="tituloLogout">¿Cerrar sesión?</h3>
            <p id="detalleLogout">Tendrás que volver a ingresar tus credenciales para acceder a tu cuenta.</p>
            <div class="sc-modal-actions">
                <button type="button" id="btnCancelarLogout" class="sc-btn sc-btn-secondary">Cancelar</button>
                <!-- Compatible con GET logout de este ZIP y POST logout cuando haya Spring Security. -->
                <form th:if="${_csrf != null}" th:action="@{/logout}" method="post"><button type="submit" class="sc-btn sc-btn-danger">Sí, salir</button></form>
                <a th:unless="${_csrf != null}" th:href="@{/logout}" class="sc-btn sc-btn-danger">Sí, salir</a>
            </div>
        </div>
    </div>
    <div th:if="${rolMenu == 'MEDICO'}" id="sc-toast-region" class="sc-toast-region" th:attr="data-url=@{/medico/notificaciones/datos},data-centro=@{/medico/notificaciones}" aria-live="polite" aria-relevant="additions"></div>
    <script th:if="${rolMenu == 'MEDICO'}" th:src="@{/js/notificaciones-medico.js}" defer></script>
    <script th:src="@{/js/saludcitas-ui.js}" defer></script>
</header>
</body></html>
