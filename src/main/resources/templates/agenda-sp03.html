<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludCitas - Mi Agenda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#F4F6F6] min-h-screen flex overflow-hidden">

    <!-- Menú y estilos compartidos con agendar-cita.html -->
    <aside class="w-64 bg-[#DCEEEA] flex flex-col justify-between h-screen border-r border-[#CFE3DF] flex-shrink-0">
        <div>
            <div class="pt-8 pb-10 flex flex-col items-center gap-2">
                <h1 class="text-3xl font-medium text-zinc-800 tracking-tight">SaludCitas</h1>
                <img class="w-14 h-14 object-contain mt-1" th:src="@{/images/Logo.svg}" alt="Logo" />
            </div>

            <nav class="space-y-2 px-3">
                <a th:href="@{/citas/agendar}" class="flex items-center gap-4 px-4 py-3 rounded-2xl text-zinc-800 hover:bg-[#cfe5e0] transition text-base font-semibold">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span>Inicio</span>
                </a>

                <a th:href="@{/citas/agendar}" class="flex items-center gap-4 px-4 py-3 rounded-2xl text-zinc-800 hover:bg-[#cfe5e0] transition text-base font-semibold">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span>Agendar Cita</span>
                </a>

                <a th:href="@{/citas/mis-citas}" class="flex items-center gap-4 px-4 py-3 rounded-2xl bg-[#A2D9CE] text-zinc-800 font-semibold text-base shadow-sm">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    <span>Mis Citas</span>
                </a>
            </nav>
        </div>

        <div class="p-4 border-t border-[#0F766E]/20">
            <a th:href="@{/logout}" class="flex items-center gap-3 px-3 py-2 text-zinc-800 hover:text-red-700 transition font-semibold text-base">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span>Cerrar Sesión</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto px-10 py-6">
        <h2 class="text-3xl font-bold text-black mb-6">Mi Agenda</h2>
        <div class="bg-white rounded-[32px] p-8 shadow-sm max-w-4xl flex-1 flex flex-col justify-between">
            <div class="space-y-6">

                <div>
                    <h3 class="text-xl font-semibold text-black">Jornada médica</h3>
                    <p class="text-zinc-500 text-sm mt-1">Consulta tus pacientes citados y los avisos de cupos liberados.</p>
                </div>
                <div class="flex flex-col gap-1.5 max-w-xs">
                    <label for="fecha" class="text-zinc-600 text-sm font-medium">Fecha</label>
                    <input id="fecha" type="date" class="w-full bg-[#F3F4F6] text-zinc-800 text-sm px-4 py-2.5 rounded-xl border border-transparent focus:border-zinc-400 outline-none">
                </div>
                <p id="contador" aria-live="polite" class="text-base font-medium text-zinc-800"></p>
                <p id="fallo" role="alert" class="text-sm text-amber-800"></p>
                <div id="avisos" aria-live="polite" class="space-y-3 text-sm text-[#2D735C]"></div>
                <div id="citas" class="space-y-4 text-sm text-zinc-700"></div>
                <script th:src="@{/js/agenda-sp03.js}"></script>

            </div>
        </div>
    </main>
</body>
</html>
