spring.application.name=clinicaapp
server.port=8080

# Conexión local directa a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/clinica_db
spring.datasource.username=postgres
spring.datasource.password=locojuego1
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea/actualiza tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Inicialización y ejecución de data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Sesiones de usuario
server.servlet.session.tracking-modes=cookie