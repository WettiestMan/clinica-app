<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludCitas - Reprogramar cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Radio button personalizado como chip */
        input[type="radio"]:checked + label {
            background-color: #388E6C !important;
            color: #ffffff !important;
            font-weight: 600;
        }
    </style>
    <link rel="stylesheet" th:href="@{/css/saludcitas.css}">
</head>
<body class="sc-layout">

    <!-- SIDEBAR -->
    <aside th:replace="~{fragments/sidebar :: sidebar('mis-citas')}"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="sc-workspace">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <main class="sc-content">
            <div class="sc-container">
        <h2 class="text-3xl font-bold text-black mb-8">Reprogramar cita</h2>

        <div th:if="${param.error}" class="mb-4 max-w-2xl bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl text-sm">
            <p th:text="${param.error}"></p>
        </div>

        <div class="bg-white rounded-[32px] p-8 shadow-sm max-w-3xl">
            <h3 class="text-xl font-semibold text-black">Reprogramar cita</h3>
            <p class="text-zinc-500 text-sm mt-1 mb-6">Nuevos horarios disponibles para el mismo médico o especialidad.</p>

            <!-- Card Banner Cita Actual -->
            <div class="bg-[#EFF2F2] rounded-2xl p-4 flex justify-between items-center mb-6 text-sm">
                <span class="text-zinc-700 font-medium">Cita actual</span>
                <span class="text-zinc-600" 
                      th:text="${cita.turno.medico.especialidad.nombre + ' · ' + #temporals.format(cita.turno.fecha, 'dd MMM') + ' · ' + #temporals.format(cita.turno.horaInicio, 'HH:mm')}">
                    Cardiología · 31 ago · 09:00
                </span>
            </div>

            <!-- Leyenda de colores -->
            <div class="flex items-center gap-6 text-xs text-zinc-500 mb-6">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#A2D9CE]"></span>
                    <span>Disponible</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-[#F8B4AC]"></span>
                    <span>Ocupado</span>
                </div>
            </div>

            <!-- Formulario de Selección y Confirmación -->
            <form th:action="@{/citas/reprogramar/confirmar}" method="post">
                <input type="hidden" name="citaId" th:value="${cita.id}">

                <!-- Grilla de Chips de Horarios -->
                <div class="flex flex-wrap gap-3 mb-8">
                    <!-- Iteración de Turnos -->
                    <div th:each="turno : ${turnos}" th:if="${turno.id != cita.turno.id}">
                        
                        <!-- Si está DISPONIBLE -->
                        <div th:if="${turno.estado == 'DISPONIBLE'}">
                            <input type="radio" 
                                   name="nuevoTurnoId" 
                                   th:value="${turno.id}" 
                                   th:id="${'turno_' + turno.id}" 
                                   class="hidden" required>
                            <label th:for="${'turno_' + turno.id}" 
                                   class="px-4 py-2 rounded-xl text-xs font-medium bg-[#A2D9CE] text-[#1E5646] cursor-pointer hover:opacity-90 transition block">
                                <span th:text="${#temporals.format(turno.fecha, 'dd MMM') + ' · ' + #temporals.format(turno.horaInicio, 'HH:mm')}"></span>
                            </label>
                        </div>

                        <!-- Si está OCUPADO -->
                        <div th:unless="${turno.estado == 'DISPONIBLE'}">
                            <span class="px-4 py-2 rounded-xl text-xs font-medium bg-[#F8B4AC] text-[#84261B] opacity-80 cursor-not-allowed block">
                                <span th:text="${#temporals.format(turno.fecha, 'dd MMM') + ' · ' + #temporals.format(turno.horaInicio, 'HH:mm')}"></span>
                            </span>
                        </div>

                    </div>
                </div>

                <!-- Botón Confirmar nuevo horario -->
                <div>
                    <button type="submit" 
                            class="px-8 py-3.5 bg-[#388E6C] text-white font-medium rounded-xl hover:bg-[#2D735C] transition shadow-sm">
                        Confirmar nuevo horario
                    </button>
                </div>
            </form>
        </div>
    
            </div>
</main>
    </div>

</body>
</html>
