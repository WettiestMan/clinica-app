<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludCitas - Iniciar Sesión</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes Poppins y Raleway -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .font-raleway { font-family: 'Raleway', sans-serif; }
        /* Evita que el navegador pinte de celeste el fondo al autocompletar */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px #F2FBF9 inset !important;
            -webkit-text-fill-color: #282828 !important;
        }
    </style>
</head>
<body class="bg-white h-screen overflow-hidden p-0 m-0">

    <div class="w-full h-screen grid grid-cols-1 lg:grid-cols-12 bg-white overflow-hidden">
        
        <!-- COLUMNA IZQUIERDA (Banner + Logo + Doctor) -->
        <div class="lg:col-span-7 xl:col-span-8 flex flex-col justify-between h-screen max-h-screen relative overflow-hidden bg-white">
            
            <!-- Encabezado con título y logo -->
            <div class="pt-10 px-12 xl:px-20 flex-shrink-0">
                <div class="flex items-center gap-6">
                    <h1 class="text-4xl xl:text-5xl font-normal text-[#282828]">“SaludCitas”</h1>
                    <img class="h-16 xl:h-20 w-auto object-contain" 
                         th:src="@{/images/logo.svg}" 
                         alt="Logo SaludCitas" />
                </div>
                <p class="text-lg xl:text-xl font-light text-[#282828] mt-3 tracking-normal">
                    Tu salud, tus citas, todo en un solo lugar.
                </p>
            </div>
            
            <!-- Imagen del doctor pegada al fondo -->
            <div class="w-full h-[65vh] relative mt-auto">
                <img class="w-full h-full object-cover object-top" 
                     th:src="@{/images/doctor.png}" 
                     alt="SaludCitas Ilustración" />
            </div>
        </div>

        <!-- COLUMNA DERECHA (Panel Formulario con franja superior) -->
        <div class="lg:col-span-5 xl:col-span-4 bg-[#ECFDFB] flex flex-col justify-between h-screen max-h-screen relative overflow-y-auto">
            
            <!-- Franja decorativa superior idéntica a Figma -->
            <div class="w-full h-24 bg-[#D7F5F0] flex-shrink-0"></div>

            <!-- Contenedor central del formulario -->
            <div class="w-full max-w-[360px] mx-auto px-6 py-4 flex flex-col justify-center my-auto">
                
                <!-- Encabezados centrados -->
                <h2 class="text-3xl font-normal text-[#282828] text-center mb-2 leading-tight">
                    Bienvenido a<br>SaludCitas
                </h2>
                <p class="text-xs text-[#4A4A4A] font-light mb-8 text-center px-2">
                    Puedes reservar tus citas médicas el mismo día y pagarla tan sólo con un click.
                </p>

                <!-- Formulario -->
                <form th:action="@{/login}" method="post" class="space-y-4">
                    
                    <!-- Campo Correo -->
                    <div class="flex flex-col gap-1.5">
                        <label for="correo" class="font-raleway text-[#282828] text-sm font-medium">Correo</label>
                        <input type="email" id="correo" name="correo" required
                               class="w-full px-5 py-2 rounded-full border border-[#757575] bg-[#F2FBF9] outline-none focus:border-[#134700] text-[#282828] text-sm transition">
                    </div>

                    <!-- Campo Contraseña con ícono -->
                    <div class="flex flex-col gap-1.5">
                        <label for="password" class="font-raleway text-[#282828] text-sm font-medium">Contraseña</label>
                        <div class="relative w-full">
                            <input type="password" id="password" name="password" required
                                   class="w-full px-5 py-2 pr-11 rounded-full border border-[#757575] bg-[#F2FBF9] outline-none focus:border-[#134700] text-[#282828] text-sm transition">
                            <!-- Ícono de ojo tachado -->
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 hover:text-black">
                                <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Botón Ingresar -->
                    <div class="pt-3">
                        <button type="submit" 
                                class="w-full bg-[#134700] text-white font-raleway text-sm font-semibold py-2.5 rounded-lg hover:bg-[#1a5f00] transition text-center shadow-sm">
                            Ingresar
                        </button>
                    </div>

                    <!-- Enlace Olvidaste tu contraseña -->
                    <div class="text-center pt-1">
                        <a th:href="@{/recuperar-password}" class="text-[#1D48DF] font-raleway font-bold text-xs underline">
                            ¿Olvidaste Tu Contraseña?
                        </a>
                    </div>

                    <!-- Enlace Registrarme -->
                    <div class="flex items-center justify-center gap-1.5 pt-4 text-xs font-raleway">
                        <span class="text-[#282828]">¿Aún No Tienes Una Cuenta?</span>
                        <a th:href="@{/registro}" class="text-[#1D48DF] font-bold underline">
                            Registrarme
                        </a>
                    </div>
                </form>
            </div>

            <!-- Espaciador inferior para balancear la franja superior -->
            <div class="h-8 flex-shrink-0"></div>

        </div>

    </div>

    <!-- Script sencillo para alternar ver contraseña -->
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }
    </script>

</body>
</html>
