spring.application.name=clinicaapp
server.port=${PORT:8080}
spring.config.import=optional:classpath:secrets.properties,optional:file:./secrets.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinica_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Modo académico: guarda cita y comprobante, sin cobro bancario real.
clinica.pago.simulado=true
clinica.reservas.revision-ms=30000
clinica.reservas.limpieza-activa=true
