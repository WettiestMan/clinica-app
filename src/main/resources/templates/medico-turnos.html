<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SaludCitas · Mis turnos asignados</title><style>body{margin:0;background:#f4f6f6;color:#183e36;font:16px system-ui}header{background:#dceeea;padding:24px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}main{max-width:1040px;margin:32px auto;padding:0 20px}section{background:white;border-radius:20px;padding:24px;margin:20px 0}form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}label{display:flex;flex-direction:column;gap:8px}input,select,button{font:inherit;border:1px solid #b9cec8;border-radius:8px;padding:10px}button{background:#2d735c;color:white;cursor:pointer}a{color:#225b4b}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:14px;border-bottom:1px solid #e4eeeb}.error{color:#a32b24}.ok{color:#24664d}small{display:block;color:#536b65}h1{font-size:26px}</style></head><body><header><b>SaludCitas</b><a th:href="@{/medico/agenda}">Citas</a><a th:href="@{/medico/turnos}">Mis turnos</a><a th:href="@{/medico/notificaciones}">Notificaciones</a><form th:action="@{/logout}" method="post"><button>Cerrar sesión</button></form></header><main><h1>Mis turnos asignados</h1><section><form th:action="@{/medico/turnos}" method="get"><label>Fecha<input type="date" name="fecha" th:value="${fecha}" required></label><button>Consultar</button></form></section><section><table><thead><tr><th>Inicio</th><th>Fin</th><th>Estado</th></tr></thead><tbody><tr th:each="t:${turnos}"><td th:text="${t.horaInicio}"></td><td th:text="${t.horaFin}"></td><td th:text="${t.estado}"></td></tr></tbody></table><p th:if="${#lists.isEmpty(turnos)}">No tienes turnos asignados en esta fecha.</p></section></main></body></html>
