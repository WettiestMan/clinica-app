<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<aside th:fragment="sidebar(paginaActiva)" th:with="rolMenu=${rolVista != null ? rolVista : (session.rol != null ? session.rol : (session.medicoLogueado != null ? 'MEDICO' : 'PACIENTE'))}" class="sc-sidebar" id="sidebarPrincipal" aria-label="Menú principal">
    <div>
        <div class="sc-brand">
            <h1>SaludCitas</h1>
            <img th:src="@{/images/Logo.svg}" alt="Logo de SaludCitas" width="56" height="56">
            <span class="sc-brand-role" th:text="${rolMenu == 'JEFE_MEDICO' ? 'Jefe médico' : (rolMenu == 'MEDICO' ? 'Médico' : 'Paciente')}">Paciente</span>
        </div>
        <nav class="sc-nav" aria-label="Navegación">
            <th:block th:if="${rolMenu == 'PACIENTE'}">
                <a th:href="@{/citas/agendar}" class="sc-nav-link" th:classappend="${paginaActiva == 'inicio'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'inicio' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7M5 9v12h5v-7h4v7h5V9"></path></svg><span>Inicio</span></a>
                <a th:href="@{/citas/agendar}" class="sc-nav-link" th:classappend="${paginaActiva == 'agendar'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'agendar' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"></path></svg><span>Agendar Cita</span></a>
                <a th:href="@{/citas/mis-citas}" class="sc-nav-link" th:classappend="${paginaActiva == 'mis-citas'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'mis-citas' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h10v16H5V5h4M9 3h6v4H9zM9 12h6m-6 4h6"></path></svg><span>Mis Citas</span></a>
            </th:block>
            <th:block th:if="${rolMenu == 'MEDICO'}">
                <a th:href="@{/medico/agenda}" class="sc-nav-link" th:classappend="${paginaActiva == 'agenda'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'agenda' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"></path></svg><span>Mi Agenda</span></a>
                <a th:href="@{/medico/turnos}" class="sc-nav-link" th:classappend="${paginaActiva == 'turnos'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'turnos' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2M22 12a10 10 0 11-20 0 10 10 0 0120 0z"></path></svg><span>Mis Turnos</span></a>
                <a th:href="@{/medico/notificaciones}" class="sc-nav-link" th:classappend="${paginaActiva == 'notificaciones'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'notificaciones' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg><span>Notificaciones</span><span id="sc-notif-count" class="sc-notif-count" th:hidden="${avisosSinLeer == null or avisosSinLeer == 0}" th:text="${avisosSinLeer != null ? avisosSinLeer : 0}" aria-label="Notificaciones sin leer"></span></a>
            </th:block>
            <th:block th:if="${rolMenu == 'JEFE_MEDICO'}">
                <a th:href="@{/jefe/usuarios}" class="sc-nav-link" th:classappend="${paginaActiva == 'usuarios'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'usuarios' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2m20 0v-2a4 4 0 00-3-3.87M13 3a4 4 0 010 8M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg><span>Usuarios</span></a>
                <a th:href="@{/jefe/horarios}" class="sc-nav-link" th:classappend="${paginaActiva == 'horarios'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'horarios' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"></path></svg><span>Disponibilidad</span></a>
                <a th:href="@{/jefe/horarios#cuentas-medicas}" class="sc-nav-link" th:classappend="${paginaActiva == 'cuentas'} ? 'is-active'" th:attr="aria-current=${paginaActiva == 'cuentas' ? 'page' : null}"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2m20 0v-2a4 4 0 00-3-3.87M13 3a4 4 0 010 8M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg><span>Accesos Médicos</span></a>
            </th:block>
        </nav>
    </div>
    <div class="sc-sidebar-footer">
        <button type="button" class="sc-logout-trigger abrir-modal-logout"><svg class="sc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4m7 14 5-5-5-5m5 5H9"></path></svg><span>Cerrar Sesión</span></button>
    </div>
</aside>
</body></html>
