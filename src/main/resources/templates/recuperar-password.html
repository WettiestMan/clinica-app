<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaludCitas - Solicitar Recuperación</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="min-h-screen w-full relative flex items-center justify-center p-4 bg-zinc-100 overflow-hidden">

    <!-- Fondo de consultorio médico con desenfoque suave -->
    <div class="absolute inset-0 bg-cover bg-center filter blur-sm scale-105 opacity-60 pointer-events-none"
         style="background-image: url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1920&q=80');">
    </div>
    <!-- Overlay blanco para atenuar fondo -->
    <div class="absolute inset-0 bg-white/40 pointer-events-none"></div>

    <!-- TARJETA CENTRAL FLOTANTE -->
    <div class="relative w-full max-w-[540px] bg-white/95 backdrop-blur-md rounded-[40px] p-10 md:p-14 shadow-2xl border border-zinc-200/80 z-10 flex flex-col items-center">
        
        <!-- Logo Corazón SVG -->
        <div class="w-16 h-16 mb-4 flex items-center justify-center">
            <svg viewBox="0 0 24 24" fill="none" class="w-full h-full text-[#F4A79D] stroke-current" stroke-width="1.8">
                <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" 
                      fill="#FFF1F0" stroke="#F4A79D"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 12h2l1-2.5 2 5 1-2.5h2" stroke="#F4A79D"/>
            </svg>
        </div>

        <!-- Título -->
        <h2 class="text-2xl md:text-3xl font-medium text-zinc-800 text-center mb-8">
            Solicitar Recuperación
        </h2>

        <!-- Aviso si el correo NO está registrado en la BD -->
        <div th:if="${param.error != null and param.error[0] == 'no_existe'}" 
             class="w-full mb-6 p-3.5 bg-red-50 border border-red-200 text-red-700 text-xs rounded-2xl flex items-center gap-2">
            <svg class="w-5 h-5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span>El correo ingresado no se encuentra registrado en el sistema.</span>
        </div>

        <!-- Formulario -->
        <form th:action="@{/recuperar-password/solicitar}" method="post" class="w-full space-y-3">
            
            <div class="flex flex-col gap-2">
                <label for="correo" class="text-zinc-600 text-xs md:text-sm font-medium">
                    Ingrese su correo registrado
                </label>
                <input type="email" id="correo" name="correo" required
                       placeholder="Ingrese su Correo electrónico"
                       class="w-full px-5 py-3.5 rounded-2xl bg-[#EEF2F4] text-zinc-800 text-sm placeholder:text-zinc-400 outline-none focus:ring-1 focus:ring-zinc-400 transition">
            </div>

            <p class="text-[11px] md:text-xs text-zinc-600 font-light leading-tight pt-1">
                Te enviamos un enlace a tu correo, válido por tiempo limitado y de un solo uso
            </p>

            <!-- Botón Enviar enlace de recuperación -->
            <div class="pt-6">
                <button type="submit" 
                        class="w-full py-3.5 px-6 bg-[#6FAFA7] hover:bg-[#5E9E96] text-white font-medium text-sm md:text-base rounded-2xl border border-[#528F87] transition shadow-sm text-center">
                    Enviar enlace de recuperación
                </button>
            </div>

            <!-- Regresar a Login -->
            <div class="text-center pt-4">
                <a th:href="@{/login}" class="text-xs text-zinc-500 hover:text-zinc-800 transition">
                    ← Volver a Iniciar Sesión
                </a>
            </div>

        </form>

    </div>

</body>
</html>
