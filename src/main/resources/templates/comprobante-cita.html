<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SaludCitas - 4 · Comprobante de Cita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#F4F6F6] min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-[32px] p-8 shadow-sm max-w-lg w-full text-center">

        <!-- Check de Éxito -->
        <div class="w-16 h-16 bg-[#DCEEEA] text-[#2D735C] rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h3 class="text-2xl font-bold text-black">¡Cita Médica Emitida!</h3>
        <p class="text-zinc-500 text-sm mt-1">Se ha reservado tu atención y emitido el comprobante fiscal.</p>

        <!-- Tarjeta de Constancia Digital -->
        <div class="bg-[#F8F9FA] border border-zinc-200 rounded-2xl p-6 text-left my-6 space-y-3">
            <div class="flex justify-between border-b pb-2">
                <span class="text-xs text-zinc-500 uppercase font-bold">Código de Cita:</span>
                <span class="text-sm font-bold text-[#2D735C]" th:text="${cita.codigoCita}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Paciente:</span>
                <span class="font-medium text-black" th:text="${cita.paciente.nombres + ' ' + cita.paciente.apellidos}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Especialidad:</span>
                <span class="font-medium text-black" th:text="${cita.turno.medico.especialidad.nombre}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Médico Tratante:</span>
                <span class="font-medium text-black" th:text="${cita.turno.medico.nombres + ' ' + cita.turno.medico.apellidos}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Fecha y Turno:</span>
                <span class="font-medium text-black" th:text="${cita.turno.fecha + ' - ' + cita.turno.horaInicio}"></span>
            </div>
            <div class="flex justify-between text-sm border-t pt-2">
                <span class="text-zinc-500">Comprobante de Pago:</span>
                <span class="font-medium text-zinc-700" th:text="${cita.numeroOperacion + ' (Pagado S/ ' + cita.monto + ')'}"></span>
            </div>
        </div>

        <div class="space-y-3">
            <button onclick="window.print()" class="w-full py-3 bg-[#2D735C] text-white font-medium rounded-xl hover:bg-[#235b49] transition shadow-sm">
                Imprimir / Descargar Constancia
            </button>
            <a th:href="@{/citas/agendar}" class="block text-sm text-zinc-500 hover:text-black font-medium transition">
                Volver a la cartelera de turnos
            </a>
        </div>
    </div>
</body>
</html>
