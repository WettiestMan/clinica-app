<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('SaludCitas - Mi Agenda')}"></head>
<body class="sc-layout" th:with="rolVista='MEDICO'">
    <aside th:replace="~{fragments/sidebar :: sidebar('agenda')}"></aside>
    <div class="sc-workspace">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <main class="sc-content">
            <div class="sc-container">
                <h2 class="sc-page-title">Mi Agenda</h2>
                <section class="sc-card" aria-labelledby="tituloJornada">
                    <div class="sc-section-header"><div><h3 class="sc-card-title" id="tituloJornada">Jornada médica</h3><p class="sc-description">Consulta tus pacientes citados.</p></div><span class="sc-badge" id="contador" aria-live="polite">Consultando citas…</span></div>
                    <form class="sc-toolbar" id="formAgenda" th:attr="data-url=@{/medico/agenda/datos},data-detalle-base=@{/medico/citas/}">
                        <div class="sc-field"><label class="sc-label" for="fecha">Fecha de atención</label><input id="fecha" type="date" class="sc-input" required></div>
                        <button type="submit" class="sc-btn">Consultar agenda</button>
                    </form>
                    <p id="fallo" class="sc-alert sc-alert-error" role="alert" hidden></p>

                    <div class="sc-table-scroll" id="citas" aria-live="polite"></div>
                    <noscript><p class="sc-alert sc-alert-warning">Activa JavaScript para consultar la agenda en esta pantalla.</p></noscript>
                </section>
            </div>
        </main>
    </div>
    <script th:src="@{/js/agenda-sp03.js}" defer></script>
</body>
</html>
