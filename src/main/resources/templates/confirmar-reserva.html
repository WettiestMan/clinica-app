<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SaludCitas - 2 · Confirmar Reserva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-[#F4F6F6] min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-[32px] p-8 shadow-sm max-w-xl w-full">
        <!-- Barra de Progreso -->
        <div class="grid grid-cols-4 gap-3 mb-6">
            <div><span class="text-xs font-medium text-zinc-400">1 · Buscar</span><div class="h-2 bg-[#3B8272] rounded-full mt-1"></div></div>
            <div><span class="text-xs font-medium text-black">2 · Confirmar</span><div class="h-2 bg-[#3B8272] rounded-full mt-1"></div></div>
            <div><span class="text-xs font-medium text-zinc-400">3 · Pagar</span><div class="h-2 bg-[#E5E7EB] rounded-full mt-1"></div></div>
            <div><span class="text-xs font-medium text-zinc-400">4 · Ticket</span><div class="h-2 bg-[#E5E7EB] rounded-full mt-1"></div></div>
        </div>

        <h3 class="text-2xl font-bold text-black mb-1">Resumen de la Cita</h3>
        <p class="text-zinc-500 text-sm mb-6">Verifica los datos antes de continuar al pago.</p>

        <div class="bg-[#F8F9FA] rounded-2xl p-5 space-y-3 border border-zinc-100 mb-6">
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Médico:</span>
                <span class="font-semibold text-black" th:text="${cita.turno.medico.nombres + ' ' + cita.turno.medico.apellidos}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Especialidad:</span>
                <span class="font-semibold text-black" th:text="${cita.turno.medico.especialidad.nombre}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Fecha y Hora:</span>
                <span class="font-semibold text-[#2D735C]" th:text="${cita.turno.fecha + ' a las ' + cita.turno.horaInicio}"></span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-zinc-500">Duración:</span>
                <span class="font-semibold text-black" th:text="${cita.turno.duracionMinutos + ' min'}"></span>
            </div>
            <div class="border-t border-zinc-200 pt-3 flex justify-between text-base">
                <span class="font-medium text-black">Importe Total:</span>
                <span class="font-bold text-lg text-[#2D735C]" th:text="${'S/ ' + cita.monto}"></span>
            </div>
        </div>

        <div class="flex gap-4">
            <a th:href="@{/citas/agendar}" class="w-1/2 py-3 rounded-xl border border-zinc-300 text-center font-medium text-zinc-700 hover:bg-zinc-50 transition">Regresar</a>
            <a th:href="@{'/citas/pago/' + ${cita.id}}" class="w-1/2 py-3 bg-[#2D735C] text-white rounded-xl text-center font-medium hover:bg-[#235b49] transition shadow-sm">Proceder al Pago</a>
        </div>
    </div>
</body>
</html>
