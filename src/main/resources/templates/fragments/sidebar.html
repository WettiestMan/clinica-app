<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- FRAGMENTO SIDEBAR: recibe paginaActiva ('inicio', 'agendar', 'mis-citas') -->
    <aside th:fragment="sidebar(paginaActiva)" 
           class="w-64 bg-[#DCEEEA] flex flex-col justify-between h-screen border-r border-[#CFE3DF] flex-shrink-0">
        <div>
            <!-- Logo y Nombre -->
            <div class="pt-8 pb-10 flex flex-col items-center gap-2">
                <h1 class="text-3xl font-medium text-zinc-800 tracking-tight">SaludCitas</h1>
                <img class="w-14 h-14 object-contain mt-1" th:src="@{/images/Logo.svg}" alt="Logo" />
            </div>

            <!-- Navegación con activación dinámica -->
            <nav class="space-y-2 px-3">
                <!-- 1. Inicio -->
                <a th:href="@{/citas/agendar}" 
                   th:class="${paginaActiva == 'inicio'} 
                             ? 'flex items-center gap-4 px-4 py-3 rounded-2xl bg-[#A2D9CE] text-zinc-800 font-semibold text-base shadow-sm' 
                             : 'flex items-center gap-4 px-4 py-3 rounded-2xl text-zinc-800 hover:bg-[#cfe5e0] transition text-base font-semibold'">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    <span>Inicio</span>
                </a>

                <!-- 2. Agendar Cita -->
                <a th:href="@{/citas/agendar}" 
                   th:class="${paginaActiva == 'agendar'} 
                             ? 'flex items-center gap-4 px-4 py-3 rounded-2xl bg-[#A2D9CE] text-zinc-800 font-semibold text-base shadow-sm' 
                             : 'flex items-center gap-4 px-4 py-3 rounded-2xl text-zinc-800 hover:bg-[#cfe5e0] transition text-base font-semibold'">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span>Agendar Cita</span>
                </a>

                <!-- 3. Mis Citas -->
                <a th:href="@{/citas/mis-citas}" 
                   th:class="${paginaActiva == 'mis-citas'} 
                             ? 'flex items-center gap-4 px-4 py-3 rounded-2xl bg-[#A2D9CE] text-zinc-800 font-semibold text-base shadow-sm' 
                             : 'flex items-center gap-4 px-4 py-3 rounded-2xl text-zinc-800 hover:bg-[#cfe5e0] transition text-base font-semibold'">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                    </svg>
                    <span>Mis Citas</span>
                </a>
            </nav>
        </div>

        <!-- Botón Cerrar Sesión (dispara el modal global) -->
        <div class="p-4 border-t border-[#0F766E]/20">
            <button type="button" class="abrir-modal-logout w-full flex items-center gap-3 px-3 py-2 text-zinc-800 hover:text-red-700 transition font-semibold text-base focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span>Cerrar Sesión</span>
            </button>
        </div>
    </aside>

</body>
</html>
